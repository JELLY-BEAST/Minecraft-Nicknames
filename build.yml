name: Build Minecraft Nicknames (26.2)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle build --no-daemon

      - name: Verify JAR metadata
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'minecraft-nicknames-*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          unzip -p "$JAR" fabric.mod.json | grep -F '"minecraft": "~26.2"'
          unzip -l "$JAR" | grep -F 'com/jellybeast/nicknames/NicknameMod.class'

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-nicknames-26.2
          path: build/libs/minecraft-nicknames-*.jar
          if-no-files-found: error
